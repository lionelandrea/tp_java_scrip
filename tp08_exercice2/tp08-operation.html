<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice Opération</title>
    <script src="operation.js" defer></script>
</head>
<body>

    <h1>Calculatrice</h1>

    <input type="number" id="nombre1" placeholder="Premier nombre">

    <select id="operateur">
        <option value="+">Addition (+)</option>
        <option value="-">Soustraction (-)</option>
        <option value="*">Multiplication (*)</option>
        <option value="/">Division (/)</option>
    </select>

    <input type="number" id="nombre2" placeholder="Deuxième nombre">

    <button id="bouton">Calculer</button>

    <p id="resultat"></p>

    <p id="erreur"></p>

</body>
</html>
