<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Filtrage des polluants</title>
    <link rel="stylesheet" href="filtrage-polluants.css">
    <script src="filtrage-polluants.js" defer></script>
</head>
<body>

    <h1>Pays les plus polluants pour le CO2</h1>

    <form id="formulaire">
        <label for="min">Minimum :</label>
        <input type="number" id="min" step="any">

        <label for="max">Maximum :</label>
        <input type="number" id="max" step="any">

        <button type="submit">Valider</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nom</th>
                <th>Valeur</th>
                <th>Pourcentage</th>
            </tr>
        </thead>

        <tbody id="corps-tableau"></tbody>
    </table>

</body>
</html>
