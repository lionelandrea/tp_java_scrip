<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des utilisateurs</title>

    <link rel="stylesheet" href="gestion-utilisateurs.css">

    <script src="gestion-utilisateurs.js" defer></script>
</head>

<body>

    <h1>Gestion des utilisateurs</h1>

    <button id="ajouter">+ Ajouter</button>

    <p id="message"></p>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Date de naissance</th>
                <th>Lieu de naissance</th>
                <th>Adresse</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="liste-utilisateurs"></tbody>

    </table>

    <dialog id="formulaire-dialogue">

        <h2 id="titre">Ajouter un utilisateur</h2>

        <form id="formulaire">

            <input type="hidden" id="id">

            <label>Nom :</label>
            <input type="text" id="nom" required>

            <label>Prénom :</label>
            <input type="text" id="prenom" required>

            <label>Genre :</label>
            <select id="genre" required>
                <option value="">Choisir</option>
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
            </select>

            <label>Date de naissance :</label>
            <input type="date" id="dateNaissance" required>

            <label>Lieu de naissance :</label>
            <input type="text" id="lieuNaissance" required>

            <label>Département de naissance :</label>
            <input type="text" id="departementNaissance" required>

            <label>Numéro de rue :</label>
            <input type="text" id="numeroRue" required>

            <label>Libellé de rue :</label>
            <input type="text" id="libelleRue" required>

            <label>Code postal :</label>
            <input type="text" id="codePostal" required>

            <label>Ville :</label>
            <input type="text" id="ville" required>

            <br>

            <button type="submit">Enregistrer</button>

            <button type="button" id="annuler">Annuler</button>

        </form>

    </dialog>

</body>
</html>
